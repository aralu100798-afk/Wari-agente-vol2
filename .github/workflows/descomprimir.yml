name: Descomprimir proyecto

on:
  workflow_dispatch:
  push:
    paths:
      - "wari-proyecto.zip"

permissions:
  contents: write

jobs:
  descomprimir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir y guardar
        run: |
          unzip -q -o wari-proyecto.zip -d _tmp
          cp -a _tmp/wari-agente/. .
          rm -rf _tmp wari-proyecto.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Proyecto de Wari descomprimido"
          git push
